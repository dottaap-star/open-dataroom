<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" role="img" aria-label="Lighthouse Labs">
  <defs>
    <style>
      .wordmark { font-family: 'Inter', -apple-system, system-ui, sans-serif; font-weight: 700; letter-spacing: -0.025em; }
      .strap    { font-family: 'Inter', -apple-system, system-ui, sans-serif; font-weight: 500; letter-spacing: 0.04em; }
    </style>
  </defs>
  <g transform="translate(22, 40)">
    <rect x="-7" y="-2" width="14" height="20" rx="1" fill="#FAFAFC"/>
    <rect x="-9" y="-12" width="18" height="10" rx="1" fill="#FAFAFC"/>
    <polygon points="-9,-12 9,-12 0,-22" fill="#FAFAFC"/>
    <polygon points="9,-7 32,-15 32,1" fill="#FBBF24" opacity="0.7"/>
  </g>
  <text x="60" y="44" class="wordmark" font-size="26" fill="#FAFAFC">Lighthouse Labs</text>
  <text x="60" y="62" class="strap" font-size="11" fill="#FBBF24" opacity="0.85">A single product, shipped late at night.</text>
</svg>
